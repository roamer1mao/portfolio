<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yu Kamisawa | Developer</title>
<meta name="description" content="Yu Kamisawa - A developer who builds what they need.">
<meta name="theme-color" content="#000000">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"></noscript>

<link rel="stylesheet" href="src/style.css">
</head>

<body>

<div class="progress" aria-hidden="true"></div>

<header class="nav">
  <a href="#top" class="logo">yu.dev</a>
  <nav class="links">
    <a href="#about" data-nav="about" data-i18n="nav.about">About</a>
    <a href="#skills" data-nav="skills" data-i18n="nav.skills">Skills</a>
    <a href="#projects" data-nav="projects" data-i18n="nav.projects">Projects</a>
    <a href="#contact" data-nav="contact" data-i18n="nav.contact">Contact</a>
  </nav>
  <button id="language-btn" type="button" class="lang">EN</button>
</header>

<main>
  <section id="top" class="hero">
    <div class="stage">
      <canvas id="scene" class="scene" aria-hidden="true"></canvas>
      <div class="frame" aria-hidden="true"><i class="pillar l"></i><i class="pillar r"></i></div>
      <div id="cockpit" class="cockpit" aria-hidden="true"></div>
      <div class="hero-inner">
        <p class="eyebrow">OS / tools / agents</p>
        <h1 data-i18n="hero.title">自分が欲しいものは、<br>自分で作る。</h1>
        <p class="lead" data-i18n="hero.description"></p>
        <div class="actions">
          <a href="#projects" class="btn btn-primary" data-i18n="actions.projects">プロジェクトを見る</a>
          <a href="#contact" class="btn" data-i18n="actions.contact">連絡する</a>
        </div>
      </div>
    </div>
  </section>

  <section id="about" class="section">
    <div class="wrap split">
      <h2 data-reveal data-i18n="about.title">必要なものを、<br>自分の手で形にする。</h2>
      <div data-stagger>
        <p class="body" data-i18n="about.description"></p>
        <dl id="facts" class="facts"></dl>
      </div>
    </div>
  </section>

  <section id="skills" class="section">
    <div class="wrap">
      <h2 data-reveal data-i18n="sections.skills">使用技術</h2>
      <div id="skills-list" class="skills" data-stagger></div>
    </div>
  </section>

  <section id="projects" class="section">
    <div class="wrap">
      <h2 data-reveal data-i18n="sections.projects">つくったもの</h2>
      <div id="projects-list" class="projects" data-stagger></div>
    </div>
  </section>

  <section id="contact" class="section contact">
    <div class="glow glow-low" aria-hidden="true"></div>
    <div class="wrap" data-stagger>
      <h2 data-i18n="contact.title">新しいプロジェクトの話、<br>お気軽にどうぞ。</h2>
      <p class="lead" data-i18n="contact.description"></p>
      <a href="mailto:roamer1mao@gmail.com" class="btn btn-primary">roamer1mao@gmail.com</a>
      <ul id="social-list" class="socials"></ul>
    </div>
  </section>
</main>

<footer class="foot">
  <span>&copy; <span id="year"></span> Yu Kamisawa</span>
  <a href="#top" data-i18n="footer.top">トップへ戻る</a>
</footer>

<div id="music" class="music" hidden></div>
<button id="music-btn" type="button" class="music-btn" aria-expanded="false" aria-controls="music" aria-label="Music">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 18.5a2.5 2.5 0 1 1-2-2.45V5.5l11-2v12a2.5 2.5 0 1 1-2-2.45V7.2l-7 1.27Z"/></svg>
</button>

<script type="module" src="src/main.js"></script>
</body>
</html>
